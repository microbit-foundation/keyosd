on:
  release:
    types: [created]
  push:
    branches:
      - "**"

env:
  # renovate: datasource=npm depName=npm
  NPM_VERSION: "11"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Update npm
        run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org

      - name: Set package version
        uses: microbit-foundation/npm-package-versioner-action@v3

      - name: Install dependencies
        run: npm ci

      - name: Build library and standalone
        run: npm run build

      - run: npm pack
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 1

      - name: Build demo site
        run: npm run build:demo

      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          # Copy demo files
          cp -r dist-demo/* deploy/
          # Create v0 directory with standalone JS
          mkdir -p deploy/v0
          cp dist/keyosd.standalone.js deploy/v0/keyosd.js

      - name: Setup Pages
        if: github.event_name == 'release'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./deploy"

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@${{ env.NPM_VERSION }} --registry=https://registry.npmjs.org
      - run: npm stage publish --allow-file=all ./*.tgz

  deploy:
    if: github.event_name == 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
